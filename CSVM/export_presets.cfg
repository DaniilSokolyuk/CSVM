[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; data/*.json (stock_loadouts.json, effect_pools.json) are non-imported resources the default
; export drops - without them every plane flies unarmed. data/*.bin is the PromptFont file the
; pad glyphs draw from, without which every pad prompt falls back to a lettered plaque.
include_filter="data/*.json, data/*.bin"
; config.json is the dev box's personal tuning override (git-ignored); it must never ship.
exclude_filter="config.json"
export_path="../.scratch/export/CSVM.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
; Shader Baker: pipeline variants are compiled at export rather than on first draw. Without it a
; machine with slow shader compilation stalls whenever an effect material is drawn for the first
; time, which lands mid-flight on the first gun impact and the first rocket. Bakes for the Vulkan
; rendering device only, which is the Windows default; a fallback to D3D12 or Compatibility gets
; no baked pipelines and compiles as before.
shader_baker/enabled=true
; Windows file properties. Off, the exported exe keeps the export template's own resource block,
; so a recipient's Properties pane and Task Manager both name Godot's version instead of this
; build's. On, Godot stamps it: the file and product version come from application/config/version
; in project.godot, since the two version keys here are left empty ("use project version"), which
; is what keeps the number in one place. The two names are set because the template's own read
; "Godot Engine".
application/modify_resources=true
application/product_name="CSVM"
application/file_description="CSVM"
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

; The Linux twin of preset.0, exported only by ExportRelease.ps1 -Linux. Filters, script mode,
; texture formats, embedded pck, Shader Baker and the .NET options are preset.0's, for the same
; reasons given there; Vulkan is the only rendering device Linux has, so every Linux run draws
; with the baked pipelines. There is no Windows resource block to stamp: the version a Linux build
; states is the one the engine reads out of project.godot at startup.
[preset.1]

name="Linux/X11"
platform="Linux"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/*.bin"
exclude_filter="config.json"
export_path="../.scratch/export-linux/CSVM.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
shader_baker/enabled=true
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
